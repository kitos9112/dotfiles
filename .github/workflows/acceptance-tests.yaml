---
name: Acceptance Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  go-tools:
    name: Go Tool Manifest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: home/private_dot_config/dotfiles/go-tools/go.mod
          cache-dependency-path: home/private_dot_config/dotfiles/go-tools/go.sum

      - name: Verify and compile Go tools
        env:
          GOBIN: ${{ runner.temp }}/go-tools-bin
        run: |
          mkdir -p "${GOBIN}"
          go -C home/private_dot_config/dotfiles/go-tools mod verify
          go -C home/private_dot_config/dotfiles/go-tools install tool
          if go -C home/private_dot_config/dotfiles/go-tools \
            list -deps github.com/mbrt/gmailctl/cmd/gmailctl |
            grep -q '^golang.org/x/crypto/openpgp'; then
            echo "gmailctl unexpectedly imports the unsupported openpgp package" >&2
            exit 1
          fi
          expected_version="$(
            go -C home/private_dot_config/dotfiles/go-tools \
              list -m -f '{{.Version}}' github.com/mbrt/gmailctl
          )"
          go version -m "${GOBIN}/gmailctl" |
            grep -F $'mod\tgithub.com/mbrt/gmailctl\t'"${expected_version}"$'\t'

  contracts:
    name: Contracts (chezmoi ${{ matrix.chezmoi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - chezmoi: "2.72.0"
          - chezmoi: latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq zsh
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/go-task/task/v3/cmd/task@v3.45.4
          if [[ "${{ matrix.chezmoi }}" == latest ]]; then
            sh -c "$(curl -fsLS https://get.chezmoi.io/lb)" -- -b "${RUNNER_TEMP}/bin"
          else
            sh -c "$(curl -fsLS https://get.chezmoi.io/lb)" -- \
              -b "${RUNNER_TEMP}/bin" -t "v${{ matrix.chezmoi }}"
          fi
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      - name: Run repository contracts
        run: task test

  linux:
    name: Linux Smoke (${{ matrix.os }})
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - { os: almalinux-9, family: almalinux, image: "almalinux:9" }
          - { os: almalinux-10, family: almalinux, image: "almalinux:10" }
          - { os: ubuntu-24.04, family: ubuntu, image: "ubuntu:24.04" }
          - { os: ubuntu-26.04, family: ubuntu, image: "ubuntu:26.04" }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Smoke tests only read the tree; nothing pushes back.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build smoke image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          file: ./tests/Dockerfile.${{ matrix.family }}
          build-args: |
            BASE_IMAGE=${{ matrix.image }}
          push: false
          provenance: false

      - name: Notify about failure
        uses: umahmood/pushover-actions@5da31193f672e7418804bdb51836bdf20f393c8f # v1.1.0
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        with:
          status: ${{ job.status }}
          title: "🟡 [Dotfiles] - Acceptance Tests Failed"
          message: "GitHub Actions acceptance tests failed. Take a look"
          url_title: "View on Github"
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          priority: "-1" # low priority - no sound or vibration generated
        if: failure() && github.event_name == 'schedule'

  macos:
    name: macOS Smoke
    runs-on: macos-26
    env:
      DOTFILES_TEST: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Smoke tests only read the tree; nothing pushes back.
          persist-credentials: false

      - name: Install chezmoi
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          sh -c "$(curl -fsLS https://get.chezmoi.io/lb)" -- -b "${RUNNER_TEMP}/bin"

      - name: Apply dotfiles to a temporary home
        run: |
          target_dir="${RUNNER_TEMP}/dotfiles-home"
          export PATH="${RUNNER_TEMP}/bin:${PATH}"
          export HOME="${target_dir}"
          export XDG_CONFIG_HOME="${target_dir}/.config"
          export XDG_DATA_HOME="${target_dir}/.local/share"
          export XDG_STATE_HOME="${target_dir}/.local/state"
          export XDG_CACHE_HOME="${target_dir}/.cache"
          mkdir -p "${HOME}" "${XDG_CONFIG_HOME}" "${XDG_DATA_HOME}" "${XDG_STATE_HOME}" "${XDG_CACHE_HOME}"
          chezmoi init --apply --source "${GITHUB_WORKSPACE}" --exclude scripts --no-tty --error-on-conflict
          chezmoi verify --source "${GITHUB_WORKSPACE}" --exclude scripts --no-tty --error-on-conflict
