---
name: Schedule/Push - Renovate

on:
  # checkov:skip=CKV_GHA_7: dry-run/log-level inputs only tune Renovate, they cannot affect build output
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry-Run"
        default: "true"
        required: false
      logLevel:
        description: "Log-Level"
        default: "debug"
        required: false
  schedule:
    - cron: "0 * * * *"
  push:
    branches:
      - master

env:
  RENOVATE_CONFIG_FILE: .github/renovate.json5

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Only the Renovate config is needed from the checkout; Renovate itself
          # authenticates with the app token below.
          persist-credentials: false

      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: generate-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          # Without these the token inherits every permission the app
          # installation holds. Renovate pushes branches, opens and merges PRs,
          # maintains the dependency dashboard issue and edits workflow files.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Renovate
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        # Passed as step env rather than interpolated into a run block, so a
        # dispatch input can never be expanded as shell code. Scheduled and push
        # runs get the fallbacks; a manual dispatch supplies its own defaults
        # (dry-run on, debug logging).
        env:
          RENOVATE_DRY_RUN: ${{ github.event.inputs.dryRun || 'false' }}
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
        with:
          configurationFile: ${{ env.RENOVATE_CONFIG_FILE }}
          token: "x-access-token:${{ steps.generate-token.outputs.token }}"
