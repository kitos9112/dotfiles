---
# https://taskfile.dev

version: "3"

vars:
  RENOVATE_LOCAL_CONFIG: "tests/renovate-bot/local-config.js"

dotenv: ["~/.env"]

tasks:
  doctor:
    desc: Check that this machine finished bootstrapping correctly.
    cmds:
      - "{{.HOME}}/.local/bin/dotfiles-doctor"

  reset:
    desc: Show what a chezmoi reset would remove (pass -- --yes to actually do it).
    cmds:
      - "{{.HOME}}/.local/bin/dotfiles-reset {{.CLI_ARGS}}"

  gnome-export:
    desc: Dump the curated GNOME dconf settings into this repository for review.
    preconditions:
      - sh: command -v dconf >/dev/null 2>&1
        msg: dconf is required; run this on a GNOME desktop.
    cmds:
      - "{{.HOME}}/.local/bin/gnome-settings-export --source {{.TASKFILE_DIR}}/home"

  test:
    desc: Run all fast repository contract tests.
    cmds:
      - bash tests/profile-config.test.sh
      - bash tests/packages-externals.test.sh
      - bash tests/desktop-integrations.test.sh
      - bash tests/script-contracts.test.sh
      - bash tests/managed-config.test.sh
      - bash tests/repository-policy.test.sh
      - bash tests/freeipa-tools.test.sh
      - bash tests/go-tools.test.sh
      - bash tests/wireshark-profiles.test.sh
      - bash tests/backup-shell-history-to-1password.sh

  test-bootstrap:
    desc: Compatibility alias for the unified test task.
    cmds:
      - task: test

  run-renovate:
    desc: Run Renovate in dry-run mode against this repository.
    env:
      GITHUB_TOKEN: "{{.GITHUB_TOKEN}}"
    preconditions:
      - sh: test -n "$GITHUB_TOKEN"
        msg: GITHUB_TOKEN must be set to run Renovate locally.
    cmds:
      - >
        RENOVATE_TOKEN="$GITHUB_TOKEN"
        docker run --rm
        --env RENOVATE_TOKEN
        --volume "$(pwd)/{{.RENOVATE_LOCAL_CONFIG}}:/usr/src/app/config.js:ro"
        renovate/renovate:slim
        --platform=github
        --print-config=true
        --force-cli=true
        --dry-run=full
        --use-base-branch-config=merge
