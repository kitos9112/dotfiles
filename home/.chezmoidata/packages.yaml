---
# Declarative package manifests consumed by home/.chezmoiscripts/.
#
# Editing any list here changes the rendered hash inside the corresponding
# run_onchange_ script, so the install step re-runs on the next `chezmoi apply`
# — on existing machines as well as fresh ones.
#
# Layout:
#   common  - every machine
#   desktop - machines with a GUI (machine_class == "desktop")
#   server  - CLI-only machines (machine_class == "server")

packages:
  apt:
    common:
      - build-essential
      - curl
      - file
      - findutils
      - git
      - iproute2
      - jq
      - libacl1
      - libacl1-dev
      - libb2-dev
      - libbz2-dev
      - libedit-dev
      - liblz4-dev
      - liblzma-dev
      - libncurses5-dev
      - libreadline-dev
      - libsqlite3-dev
      - libssl-dev
      - libxml2-dev
      - libxmlsec1-dev
      - libzstd-dev
      - llvm
      - locales
      - net-tools
      - python3
      - python3-dev
      - python3-pip
      - sed
      - socat
      - software-properties-common
      - sshpass
      - tk-dev
      - tmux
      - unzip
      - vim
      - wget
      - wireguard
      - wireguard-tools
      - xz-utils
      - zlib1g-dev
      - zsh
    # The 1Password desktop app only exists on GUI machines; servers get the
    # CLI alone and authenticate with `op account add`.
    desktop:
      - 1password
      - 1password-cli
      - alacritty
      - fontconfig
      - wireshark
    server:
      - 1password-cli

  dnf:
    common:
      - 1password-cli
      - bison
      - bzip2
      - bzip2-devel
      - cronie
      - cronie-anacron
      - curl
      - dnf-automatic
      - file
      - gcc
      - g++
      - glibc-langpack-en
      - glibc-langpack-es
      - git
      - jq
      - libffi-devel
      - libxcrypt-compat
      - make
      - openssl-devel
      - patch
      - python
      - readline-devel
      - sqlite
      - sqlite-devel
      - tk-devel
      - tmux
      - unzip
      - util-linux-user
      - vim
      - xz
      - zlib-devel
      - zsh
    desktop:
      - 1password
      - wireshark
    server: []
    distributions:
      fedora:
        desktop:
          - alacritty
        server: []
      almalinux:
        desktop: []
        server: []

  brew:
    taps:
      - common-fate/granted
    common:
      - awscli
      - borgbackup
      - chezmoi
      - figlet
      - fluxcd/tap/flux
      - gcc
      - gh
      - git-crypt
      - go-task/tap/go-task
      - gomplate
      - granted
      - iperf3
      - k9s
      - pre-commit
      - shellcheck
      - sops
      - yq

  # Ghostty ships no official apt repository; the community ghostty-ubuntu
  # project publishes per-release debs.
  ghostty:
    repo: mkasberg/ghostty-ubuntu
    # Upstream Ghostty version, matched against the installed dpkg version
    # (which looks like 1.3.1-0.ppa2) to decide whether to reinstall.
    version: "1.3.1"
    # Full release tag, which carries a packaging suffix beyond the version:
    # tags look like 1.3.1-0-ppa2, so this cannot be derived from version alone.
    tag: "1.3.1-0-ppa2"

  # AI coding CLIs. Each tool self-updates after installation; bumping a pin
  # here re-runs the installer so a machine can be forced back onto a known
  # channel.
  ai_clis:
    claude:
      channel: stable
    opencode:
      channel: stable
    codex:
      npm_package: "@openai/codex"
      version: latest

  rust:
    toolchain: stable
    cargo_tools:
      - name: license-generator
        # renovate: datasource=crate packageName=license-generator
        version: "1.3.0"
