{{- $root := . -}}
{{- $arch := includeTemplate "map-architectures" . -}}
{{- $platform := includeTemplate "map-platforms" . -}}

{{- if ne (env "DOTFILES_TEST") "true" }}
##########################
#      OMZ Plugins       #
##########################
".oh-my-zsh":
  type: "git-repo"
  url: "https://github.com/ohmyzsh/ohmyzsh.git"
  exact: true
  refreshPeriod: "72h"

".oh-my-zsh-custom/plugins/zsh-syntax-highlighting":
  type: "git-repo"
  url: "https://github.com/zsh-users/zsh-syntax-highlighting.git"
  exact: true
  refreshPeriod: "24h"

".oh-my-zsh-custom/plugins/zsh-completions":
  type: "git-repo"
  url: "https://github.com/zsh-users/zsh-completions.git"
  exact: true
  refreshPeriod: "24h"

".oh-my-zsh-custom/themes/powerlevel10k":
  type: "git-repo"
  url: "https://github.com/romkatv/powerlevel10k.git"
  exact: true
  refreshPeriod: "24h"

".tmux":
  type: "git-repo"
  url: "https://github.com/gpakosz/.tmux.git"
  exact: true
  refreshPeriod: "24h"

".local/bin/asdf":
  type: archive-file
  url: "https://github.com/asdf-vm/asdf/releases/download/v{{ .versions.asdf }}/asdf-v{{ .versions.asdf }}-{{ .chezmoi.os }}-{{ .chezmoi.arch }}.tar.gz"
  path: asdf

{{- range list "uv" "uvx" }}
".local/bin/{{ . }}":
  type: archive-file
  url: "https://github.com/astral-sh/uv/releases/download/{{ $root.versions.uv }}/uv-{{ $arch }}-{{ $platform }}-{{ $root.chezmoi.os }}{{ if eq $root.chezmoi.os "linux" }}-gnu{{ end }}.tar.gz"
  stripComponents: 1
  path: "{{ . }}"
{{ end }}

".fzf":
  type: "git-repo"
  url: "https://github.com/junegunn/fzf.git"
  exact: true
  refreshPeriod: "24h"

".local/bin/fzf":
  type: archive-file
  url: "https://github.com/junegunn/fzf/releases/download/v{{ .versions.fzf }}/fzf-{{ .versions.fzf }}-{{ .chezmoi.os}}_{{ .chezmoi.arch }}.tar.gz"
  path: fzf

".config/wireshark_profiles":
  type: "git-repo"
  url: "https://github.com/amwalding/wireshark_profiles.git"
  refreshPeriod: "72h"

{{/* Fonts are only useful where something renders them, so CLI-only machines skip the download. */}}
{{- if eq (includeTemplate "machine-class" .) "desktop" }}
{{ $fontsDir := .fontsDir }}
{{- if eq .chezmoi.os "darwin" }}{{ $fontsDir = "Library/Fonts" }}{{ end }}
"{{ $fontsDir }}":
  type: "archive"
  url: "https://github.com/ryanoasis/nerd-fonts/releases/download/v{{ .versions.nerd_fonts }}/{{ .terminalFont.archive }}"
  include:
    - "*.otf"
    - "*.ttf"
  exact: true
  refreshPeriod: "168h"
{{- end }}

".config/alacritty/themes":
  type: "git-repo"
  url: "https://github.com/alacritty/alacritty-theme"
  exact: true
  refreshPeriod: "72h"

".local/bin/retry":
  type: file
  url: "https://github.com/kadwanev/retry/raw/{{ .versions.retry }}/retry"
  executable: true

{{/* Portable VS Code, Go and direnv stand in for Homebrew-installed tooling, so
     they follow "no Homebrew" rather than "no sudo": a sudo-capable machine that
     opted out of brew still needs them. */}}
{{ if ne (includeTemplate "use-homebrew" . | trim) "true" -}}
".apps/vscode":
  type: "archive"
  url: "https://update.code.visualstudio.com/{{ .versions.vscode }}/{{ if eq .chezmoi.os "darwin" }}{{ if eq .chezmoi.arch "amd64" }}darwin{{ else }}darwin-arm64{{ end }}{{ else if eq .chezmoi.os "linux" }}linux-{{ if eq .chezmoi.arch "amd64" }}x64{{ else }}arm64{{ end }}{{ end }}/stable"
  exact: true
  stripComponents: 1
  refreshPeriod: "168h"

".go":
  type: "archive"
  url: "https://go.dev/dl/go{{ .versions.go }}.{{ .chezmoi.os }}-{{ .chezmoi.arch }}.tar.gz"
  exact: true
  stripComponents: 1
  refreshPeriod: "168h"

".local/bin/direnv":
  type: "file"
  url: "https://github.com/direnv/direnv/releases/download/v{{ .versions.direnv }}/direnv.{{ .chezmoi.os }}-{{ .chezmoi.arch }}"
  executable: true
{{ end -}}

{{- end }}
