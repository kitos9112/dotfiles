{{- /* "chezmoi" is present as work around for https://github.com/twpayne/chezmoi/discussions/1724 */ -}}
{{- $cache := dict "chezmoi" .chezmoi -}}
{{- $arch := includeTemplate "map-architectures" . -}}
{{- $platform := includeTemplate "map-platforms" . -}}
{{- $vscodeVersion := "1.133.0" -}}

{{- template "read-versions-and-revisions-cache" $cache -}}

{{- if ne (env "DOTFILES_TEST") "true" }}
##########################
#      OMZ Plugins       #
##########################
".oh-my-zsh":
  type: "git-repo"
  url: "https://github.com/ohmyzsh/ohmyzsh.git"
  exact: true
  refreshPeriod: "72h"

".oh-my-zsh-custom/plugins/zsh-syntax-highlighting":
  type: "git-repo"
  url: "https://github.com/zsh-users/zsh-syntax-highlighting.git"
  exact: true
  refreshPeriod: "24h"

".oh-my-zsh-custom/plugins/zsh-completions":
  type: "git-repo"
  url: "https://github.com/zsh-users/zsh-completions.git"
  exact: true
  refreshPeriod: "24h"

".oh-my-zsh-custom/themes/powerlevel10k":
  type: "git-repo"
  url: "https://github.com/romkatv/powerlevel10k.git"
  exact: true
  refreshPeriod: "24h"

".tmux":
  type: "git-repo"
  url: "https://github.com/gpakosz/.tmux.git"
  exact: true
  refreshPeriod: "24h"

".local/bin/asdf":
  type: archive-file
  {{ $asdfVersion := includeTemplate "get-github-latest-version" (list "asdf-vm/asdf" $cache) }}
  url: "https://github.com/asdf-vm/asdf/releases/download/v{{ $asdfVersion }}/asdf-v{{ $asdfVersion }}-{{ .chezmoi.os }}-{{ .chezmoi.arch }}.tar.gz"
  path: asdf

{{ $uvVersion := includeTemplate "get-github-latest-version" (list "astral-sh/uv" $cache) }}
{{- range list "uv" "uvx" }}
".local/bin/{{ . }}":
  type: archive-file
  url: "https://github.com/astral-sh/uv/releases/download/{{ $uvVersion }}/uv-{{ $arch }}-{{ $platform }}-{{ $cache.chezmoi.os }}{{ if eq $cache.chezmoi.os "linux" }}-gnu{{ end }}.tar.gz"
  stripComponents: 1
  path: "{{ . }}"
{{ end }}

".fzf":
  type: "git-repo"
  url: "https://github.com/junegunn/fzf.git"
  exact: true
  refreshPeriod: "24h"

".local/bin/fzf":
  type: archive-file
  {{ $fzfVersion := includeTemplate "get-github-latest-version" (list "junegunn/fzf" $cache) }}
  url: "https://github.com/junegunn/fzf/releases/download/v{{ $fzfVersion }}/fzf-{{ $fzfVersion }}-{{ .chezmoi.os}}_{{ .chezmoi.arch }}.tar.gz"
  path: fzf

".config/wireshark_profiles":
  type: "git-repo"
  url: "https://github.com/amwalding/wireshark_profiles.git"
  refreshPeriod: "72h"

{{/* Fonts are only useful where something renders them, so CLI-only machines skip the download. */}}
{{- if eq (includeTemplate "machine-class" .) "desktop" }}
{{ $fontsDir := .fontsDir }}
{{- if eq .chezmoi.os "darwin" }}{{ $fontsDir = "Library/Fonts" }}{{ end }}
{{- $nerdFontsVersion := includeTemplate "get-github-latest-version" (list "ryanoasis/nerd-fonts" $cache) }}
"{{ $fontsDir }}":
  type: "archive"
  url: "https://github.com/ryanoasis/nerd-fonts/releases/download/v{{ $nerdFontsVersion }}/{{ .terminalFont.archive }}"
  include:
    - "*.otf"
    - "*.ttf"
  exact: true
  refreshPeriod: "168h"
{{- end }}

".config/alacritty/themes":
  type: "git-repo"
  url: "https://github.com/alacritty/alacritty-theme"
  exact: true
  refreshPeriod: "72h"

".local/bin/retry":
  type: file
  {{ $retryVersion := includeTemplate "get-github-latest-version" (list "kadwanev/retry" $cache) }}
  url: "https://github.com/kadwanev/retry/raw/{{ $retryVersion }}/retry"
  executable: true

{{/* Portable VS Code, Go and direnv stand in for Homebrew-installed tooling, so
     they follow "no Homebrew" rather than "no sudo": a sudo-capable machine that
     opted out of brew still needs them. */}}
{{ if ne (includeTemplate "use-homebrew" . | trim) "true" -}}
".apps/vscode":
  type: "archive"
  url: "https://update.code.visualstudio.com/{{ $vscodeVersion }}/{{ if eq .chezmoi.os "darwin" }}{{ if eq .chezmoi.arch "amd64" }}darwin{{ else }}darwin-arm64{{ end }}{{ else if eq .chezmoi.os "linux" }}linux-{{ if eq .chezmoi.arch "amd64" }}x64{{ else }}arm64{{ end }}{{ end }}/stable"
  exact: true
  stripComponents: 1
  refreshPeriod: "168h"

".go":
  type: "archive"
  url: "https://go.dev/dl/go1.27.0.{{ .chezmoi.os }}-{{ .chezmoi.arch }}.tar.gz"
  exact: true
  stripComponents: 1
  refreshPeriod: "168h"

".local/bin/direnv":
  type: "file"
  {{ $direnvVersion := includeTemplate "get-github-latest-version" (list "direnv/direnv" $cache) }}
  url: "https://github.com/direnv/direnv/releases/download/v{{ $direnvVersion }}/direnv.{{ .chezmoi.os }}-{{ .chezmoi.arch }}"
  executable: true
{{ end -}}

{{- end }}

{{- template "save-versions-and-revisions-cache" $cache -}}
